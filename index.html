<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>竞赛推文排版台</title>
<style>
/* 布局：三栏工作台。左=稿件库，中=模块编辑，右=手机预览与封面图。预览区始终白底，等同公众号正文。 */
:root{
  --bg:#ECEEE9; --panel:#FAFAF7; --raised:#FFFFFF; --ink:#1B242E; --muted:#636E78; --line:#D6DBD3;
  --accent:#BF432B; --accent-ink:#FFFFFF; --focus:#1B5FA6; --ok:#2C7A57; --warn:#A8691A;
  --font-body:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-display:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13171C; --panel:#1B2027; --raised:#232A32; --ink:#E7EAED; --muted:#98A2AC; --line:#303841;
    --accent:#E2674E; --accent-ink:#1A0E0B; --focus:#7DB4EE; --ok:#5FBF93; --warn:#E0A64B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171C; --panel:#1B2027; --raised:#232A32; --ink:#E7EAED; --muted:#98A2AC; --line:#303841;
  --accent:#E2674E; --accent-ink:#1A0E0B; --focus:#7DB4EE; --ok:#5FBF93; --warn:#E0A64B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:1px}
.brand small{color:var(--muted);font-size:12px}
.seal{width:12px;height:12px;background:var(--accent);display:inline-block;transform:translateY(1px)}
.top .sp{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--raised);padding:6px 12px;border-radius:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 440px;gap:0}
.col{min-height:0;overflow:auto;padding:16px}
.lib{border-right:1px solid var(--line);background:var(--panel)}
.view{border-left:1px solid var(--line);background:var(--panel)}
h2{font-size:12px;letter-spacing:2px;color:var(--muted);margin:0 0 8px;font-weight:600}
.newrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.newrow .btn{text-align:left;padding:8px 10px;line-height:1.3}
.newrow .btn b{display:block;font-size:13px}
.newrow .btn span{font-size:11px;color:var(--muted)}
details.ai{border:1px solid var(--line);border-radius:8px;background:var(--raised);margin-bottom:16px}
details.ai summary{padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px}
details.ai .in{padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
details.ai p{margin:0;font-size:12px;color:var(--muted)}
.drafts{display:flex;flex-direction:column;gap:6px}
.draft{border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%}
.draft.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.draft b{font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.draft .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);align-items:center}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11px}
.edit{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.fld{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.fld:first-child{margin-top:0}
.fld label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:6px 8px;line-height:1.5}
textarea{resize:vertical;min-height:64px}
.metarow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:end}
.metarow .fld,.cover-form .fld{margin-top:0}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px 12px}
.blk.sel{border-color:var(--focus)}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.blk-t{font-weight:600;font-size:13px}
.blk-t i{font-style:normal;color:var(--muted);font-weight:400;font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}
.blk-a{display:flex;gap:4px}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.addbar{position:sticky;bottom:-16px;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--muted);background:transparent;border-radius:14px;padding:2px 10px;font-size:12px}
.chip:hover{border-style:solid;border-color:var(--ink)}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:transparent;padding:5px 12px;border-radius:6px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.phone{background:#FFFFFF;color:#333333;border:1px solid var(--line);border-radius:14px;padding:18px 16px 28px;width:100%;max-width:407px;margin:0 auto;color-scheme:light}
.phone .ptitle{font-size:22px;line-height:1.4;font-weight:700;color:#111;margin:0 0 8px;font-family:var(--font-body)}
.phone .pmeta{font-size:13px;color:#8a8f94;margin:0 0 18px}
.phone .pmeta b{color:#576b95;font-weight:400}
#article{overflow-wrap:anywhere}
.check{margin-top:14px;font-size:12px;color:var(--muted)}
.check ol{margin:4px 0 0;padding-left:18px}
.cover-form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:10px}
.cover-form .wide{grid-column:1/-1}
canvas#cv{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block;background:#fff}
#coverOut img{max-width:100%;border:1px solid var(--line);margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:30}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.overlay.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:100%;max-width:520px}
.sheet h3{margin:0 0 4px;font-size:16px}
.sheet .row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.notice{font-size:12px;color:var(--muted);border-left:3px solid var(--warn);padding:4px 10px;background:var(--raised);border-radius:0 6px 6px 0}
@media (max-width:1180px){
  body{display:block}
  .grid{display:block}
  .col{overflow:visible}
  .lib,.view{border:0;border-bottom:1px solid var(--line)}
  .addbar{position:static}
}
@media (max-width:520px){.metarow,.cover-form{grid-template-columns:1fr}.top{padding:10px 16px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="seal" aria-hidden="true"></span><h1>竞赛推文排版台</h1><small>填内容，出排版，复制进公众号</small></div>
  <div class="sp"></div>
  <div class="status" id="cloud"><span class="dot"></span><span>正在连接稿件库</span></div>
  <button class="btn" id="btnSettings" type="button">账号设置</button>
</header>

<main class="grid">
  <aside class="col lib" aria-label="稿件库">
    <h2>新建稿件</h2>
    <div class="newrow" id="newrow"></div>
    <details class="ai" id="aiBox" hidden>
      <summary>粘贴官方通知，自动填表</summary>
      <div class="in">
        <p>把赛事官网的通知全文贴进来，会生成一篇通知型稿件。生成后请逐项对照原文核对日期。</p>
        <textarea id="aiText" rows="6" placeholder="在这里粘贴通知原文"></textarea>
        <button class="btn primary" id="aiGo" type="button">提取并生成稿件</button>
        <p id="aiMsg" role="status"></p>
      </div>
    </details>
    <h2>我的稿件</h2>
    <div class="drafts" id="drafts"></div>
  </aside>

  <section class="col edit" id="edit" aria-label="内容编辑"></section>

  <section class="col view" aria-label="预览与封面">
    <div class="tabs" role="tablist">
      <button class="tab on" id="tabArticle" type="button" role="tab" aria-selected="true">文章预览</button>
      <button class="tab" id="tabCover" type="button" role="tab" aria-selected="false">封面与配图</button>
    </div>
    <div id="paneArticle">
      <div class="acts">
        <button class="btn primary" id="copyBody" type="button">复制正文到公众号</button>
        <button class="btn" id="copyTitle" type="button">复制标题</button>
      </div>
      <div class="phone">
        <p class="ptitle" id="pTitle"></p>
        <p class="pmeta"><b id="pName"></b>　发布后显示日期</p>
        <div id="article"></div>
      </div>
      <div class="check">
        发布前检查
        <ol>
          <li>日期、人数、链接逐项对照赛事官网。</li>
          <li>虚线的配图位已换成真实图片。</li>
          <li>在公众号后台用手机预览一遍。</li>
        </ol>
      </div>
    </div>
    <div id="paneCover" hidden>
      <div class="cover-form">
        <div class="fld"><label for="cvSize">尺寸</label><select id="cvSize"><option value="head">头条封面 2.35:1</option><option value="sq">次条封面 1:1</option><option value="wide">文内横图 16:9</option></select></div>
        <div class="fld"><label for="cvStyle">样式</label><select id="cvStyle"><option value="dark">深色大字</option><option value="light">浅色圆形</option><option value="split">分栏</option></select></div>
        <div class="fld"><label for="cvTag">小标签</label><input type="text" id="cvTag"></div>
        <div class="fld"><label for="cvSub">副标题</label><input type="text" id="cvSub"></div>
        <div class="fld wide"><label for="cvTitle">主标题（可换行）</label><textarea id="cvTitle" rows="2"></textarea></div>
      </div>
      <div class="acts">
        <button class="btn" id="cvFill" type="button">从当前稿件带入</button>
        <button class="btn primary" id="cvSave" type="button">保存图片</button>
      </div>
      <canvas id="cv" width="1410" height="600" aria-label="封面图预览"></canvas>
      <div id="coverOut"></div>
      <p class="hint">颜色跟随当前稿件的主题色。封面图在公众号后台“封面”处上传；文内横图在正文里插入。</p>
    </div>
  </section>
</main>

<div class="overlay" id="settings" role="dialog" aria-modal="true" aria-labelledby="setH">
  <div class="sheet">
    <h3 id="setH">账号设置</h3>
    <p class="hint">这些内容会出现在每篇文章的签名、账号卡和资料领取块里。</p>
    <div class="fld"><label for="sName">账号名</label><input type="text" id="sName"></div>
    <div class="fld"><label for="sSlogan">一句口号</label><input type="text" id="sSlogan"></div>
    <div class="fld"><label for="sAbout">我们发什么</label><input type="text" id="sAbout"></div>
    <div class="fld"><label for="sScope">覆盖赛事</label><input type="text" id="sScope"></div>
    <div class="fld"><label for="sRes">资料说明</label><input type="text" id="sRes"></div>
    <div class="fld"><label for="sWx">客服微信（没定可以先空着）</label><input type="text" id="sWx"></div>
    <div class="row"><button class="btn" id="setCancel" type="button">取消</button><button class="btn primary" id="setOk" type="button">保存</button></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- 基础 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const lines = s => String(s || "").split("\n").map(x => x.trim()).filter(Boolean);
const cells = l => l.split("|").map(x => x.trim());
let toastTimer = 0;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200); }

const THEMES = {
  navy:{name:"藏青",main:"#12355B",accent:"#0E8F8A",soft:"#EDF4F6",line:"#D3E0E5",glow:"#8FE0DA"},
  pine:{name:"松绿",main:"#2E5E4E",accent:"#A1823F",soft:"#EFF3EA",line:"#D8E0D0",glow:"#E6CE96"},
  sky:{name:"晴蓝",main:"#1B5FA6",accent:"#2B86D9",soft:"#EAF3FB",line:"#CCE0F3",glow:"#C4E2FF"},
  brick:{name:"砖红",main:"#8E3B2F",accent:"#BF7A36",soft:"#F8F0EA",line:"#EADBCD",glow:"#F4CFA3"},
  plum:{name:"黛紫",main:"#4A3B6B",accent:"#8468B5",soft:"#F1EEF7",line:"#DCD5EA",glow:"#D9CAF4"},
  ink:{name:"墨黑",main:"#22272E",accent:"#A97B25",soft:"#F3F3F0",line:"#DDDDD6",glow:"#E8CB80"}
};
const TPL = {
  notice:{name:"通知型",desc:"报名通知、节点提醒",theme:"navy",tag:"正式通知"},
  list:{name:"名单型",desc:"获奖名单、晋级榜单",theme:"navy",tag:"获奖名单"},
  story:{name:"经验复盘型",desc:"获奖团队讲过程",theme:"pine",tag:"获奖复盘"},
  guide:{name:"攻略对比型",desc:"规则解读、赛事对比",theme:"sky",tag:"备赛攻略"}
};
const BT = {
  kicker:{n:"眉题小字",f:[["text","文字","in"]]},
  hero:{n:"主视觉色块",f:[["kicker","小标签","in"],["title","大标题（可换行）","ta"],["sub","副标题","in"],["foot","底部一行","in"]]},
  para:{n:"正文",f:[["text","空一行分段；用 **文字** 加粗","ta"]]},
  callout:{n:"提示框",f:[["title","标题（可空）","in"],["text","内容，一行一条","ta"]]},
  section:{n:"小节标题",f:[["label","小标签，如 01 / 赛程","in"],["title","标题，写成一句结论","in"]]},
  h3:{n:"小标题",f:[["text","文字","in"]]},
  table:{n:"表格",f:[["head","表头，用 | 分列","in"],["rows","每行一条，用 | 分列","ta"]]},
  timeline:{n:"时间轴卡",f:[["kicker","小标签","in"],["title","卡片标题","in"],["strip","深色提示条（可空）","in"],["rows","每行：日期 | 事项 | 备注","ta"],["foot","来源说明","in"],["cap","卡片下方图注（可空）","in"]]},
  steps:{n:"流程卡",f:[["kicker","小标签","in"],["title","卡片标题","in"],["rows","每行：步骤 | 说明","ta"],["foot","来源说明","in"],["cap","卡片下方图注（可空）","in"]]},
  compare:{n:"对照卡",f:[["kicker","小标签","in"],["title","卡片标题","in"],["rows","每行：名称 | 小字 | 要点","ta"],["foot","读图提示","in"],["cap","卡片下方图注（可空）","in"]]},
  image:{n:"配图位",f:[["desc","这里放什么图","in"],["cap","图注","in"]]},
  source:{n:"来源声明",f:[["text","文件名、官网发布日期、核对日期","ta"]]},
  cta:{n:"资料领取块",f:[["name","资料名","in"],["items","包含哪些内容","in"],["kw","添加客服时备注的关键词","in"],["extra","补充一句（可空）","in"]]},
  sign:{n:"签名和账号卡",f:[]},
  divider:{n:"分隔线",f:[]}
};
const b = (type, o) => Object.assign({id:uid("b"), type}, o || {});

/* ---------- 模板 ---------- */
function tplBlocks(kind){
  if (kind === "notice") return [
    b("hero",{kicker:"2026—2027 · 第十三届",title:"全国大学生能源经济\n学术创意大赛",sub:"报名通道已开启",foot:"报名：2026年11月17日—12月16日"}),
    b("para",{text:"第十三届全国大学生能源经济学术创意大赛已发布正式通知。本届**先报名、后提交作品**：报名时间是 **2026年11月17日—12月16日**，作品提交在 **2027年2月22日—3月13日**。\n\n下面按官方通知，把赛程、组队规则、作品类别和报名入口放在一起，方便和队友逐项核对。"}),
    b("callout",{title:"先记住这 3 件事",text:"① 报名和交作品是两个阶段，错过报名就不能提交作品。\n② 每队 1—4 名学生，指导教师最多 2 名。\n③ 报名只走大赛官网系统，不接受邮件报名。"}),
    b("section",{label:"01 / 赛程",title:"赛程安排：先报名，再交作品"}),
    b("timeline",{kicker:"第十三届能经大赛",title:"关键时间，一次看清",strip:"2026 年报名，2027 年提交与评审",rows:"2026.11.17—12.16 | 报名 | 官网系统实名注册\n2027.02.22—03.13 | 作品提交 | 报名成功的团队才能提交\n2027.03.14—04.18 | 初审、校赛、区域（省）赛 | \n2027.04.20—05.10 | 全国赛通讯评审与会议评审 | \n2027.05.22—05.23 | 全国总决赛及颁奖 | 河北地质大学",foot:"来源：大赛第 1 号通知｜【账号名】整理",cap:"示例数据，发文前请对照官网通知核对"}),
    b("h3",{text:"拿到作品编号，才算报名成功"}),
    b("para",{text:"报名由作品联系人在官网系统统一办理。系统生成作品编号，就说明报名已经成功，不用等邮件确认。"}),
    b("section",{label:"02 / 组队",title:"谁能参赛，怎么组队"}),
    b("table",{head:"核对项目 | 要求",rows:"团队人数 | 每队 1—4 名学生\n指导教师 | 可以不设；每件作品最多 2 名\n联系人 | 负责报名和提交，报名后不能更换"}),
    b("callout",{title:"",text:"**组别和联系人在报名时就定下来。**报名前先和队友确认，后面改不了。"}),
    b("section",{label:"03 / 作品",title:"三类作品，先选对类别"}),
    b("compare",{kicker:"作品类别",title:"三类作品各是什么",rows:"研究论文 | 类别一 | 提交时还要选研究方法类别\n调研报告 | 类别二 | 【补充这一类的要求】\n创新创业 | 类别三 | 【补充这一类的要求】",foot:"来源：大赛第 1 号通知",cap:""}),

const LS_D = "tuiwen.drafts.v1", LS_S = "tuiwen.settings.v1", LS_C = "tuiwen.current.v1";

function lsGet(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
(function boot(){
  const ds = lsGet(LS_D), st = lsGet(LS_S), c = lsGet(LS_C);
  if (st && typeof st === "object") S.settings = Object.assign({}, DEFAULT_SET, st);
  if (Array.isArray(ds) && ds.length) S.drafts = ds.filter(d => d && d.id && Array.isArray(d.blocks));
  if (!S.drafts.length) S.drafts = [newDraft("notice", true)];
  S.cur = (c && S.drafts.some(d => d.id === c)) ? c : S.drafts[0].id;
})();
const cur = () => S.drafts.find(d => d.id === S.cur) || S.drafts[0];

let db = null, sampleFn = null, dl = null;
const Q = {};
function setCloud(kind){
  const map = {local:["warn","只保存在这台设备的浏览器里"], saving:["","正在保存"], saved:["ok","已保存到稿件库"], error:["warn","云端保存失败，已保存在本机"], wait:["","正在连接稿件库"], slow:["warn","稿件库暂时连不上，先保存在本机"]};
  const m = map[kind] || map.local;
  $("#cloud").innerHTML = '<span class="dot ' + m[0] + '"></span><span>' + m[1] + '</span>';
}
function cloudWrite(key, path, getData){
  if (!db) return;
  const q = Q[key] || (Q[key] = {busy:false, again:false});
  if (q.busy){ q.again = true; return; }
  const data = getData(); if (!data) return;
  q.busy = true; setCloud("saving");
  let p;
  try{ p = db.doc(path).set(data); }catch(e){ q.busy = false; setCloud("error"); return; }
  p.then(() => setCloud("saved"), () => setCloud("error")).then(() => { q.busy = false; if (q.again){ q.again = false; cloudWrite(key, path, getData); } });
}
function plain(d){ return {tpl:d.tpl, theme:d.theme, title:d.title, updatedAt:d.updatedAt, blocks:d.blocks.map(x => Object.assign({}, x))}; }
let saveTimer = 0;
const dirty = {};
function pushDraft(id){ cloudWrite(id, "drafts/" + id, () => { const x = S.drafts.find(y => y.id === id); return x ? plain(x) : null; }); }
function touch(){
  const d = cur(); d.updatedAt = Date.now(); d.example = false; dirty[d.id] = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { persistLocal(); Object.keys(dirty).forEach(id => { delete dirty[id]; pushDraft(id); }); renderDrafts(); }, 1200);
}
function persistLocal(){ lsSet(LS_D, S.drafts.filter(d => !d.example)); lsSet(LS_S, S.settings); lsSet(LS_C, S.cur); if (!db) setCloud("local"); }
function withTimeout(p, ms){ return new Promise((res, rej) => { const t = setTimeout(() => rej(new Error("timeout")), ms); p.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); }); }); }
async function initCaps(){
  if (!(window.claude && typeof window.claude.use === "function")){ setCloud("local"); return; }
  window.claude.use("sample").then(s => { sampleFn = s; if (s) $("#aiBox").hidden = false; }, () => {});
  window.claude.use("downloads").then(d => { dl = d; }, () => {});
  let d = null;
  try{ d = await window.claude.use("db"); }catch(e){ d = null; }
  if (!d){ setCloud("local"); return; }
  try{
    const res = await withTimeout(Promise.all([d.collection("drafts").get(), d.doc("config/account").get()]), 10000);
    db = d;
    const qs = res[0], cfg = res[1];
    if (cfg && cfg.exists){ S.settings = Object.assign({}, DEFAULT_SET, cfg.data()); }
    let replacedCur = false;
    const seen = {};
    (qs.docs || []).forEach(snap => {
      const data = snap.data(); if (!data || !Array.isArray(data.blocks)) return;
      seen[snap.id] = true;
      const cloud = {id:snap.id, tpl:data.tpl || "notice", theme:data.theme || "navy", title:data.title || "", updatedAt:data.updatedAt || 0, blocks:data.blocks.map(x => Object.assign({}, x))};
      const i = S.drafts.findIndex(x => x.id === snap.id);
      if (i < 0) S.drafts.push(cloud);
      else if ((cloud.updatedAt || 0) > (S.drafts[i].updatedAt || 0)){ S.drafts[i] = cloud; if (cloud.id === S.cur) replacedCur = true; }
    });
    if (S.drafts.some(x => !x.example) && S.drafts.some(x => x.example)){
      const wasCur = cur().example;
      S.drafts = S.drafts.filter(x => !x.example);
      if (wasCur){ S.cur = S.drafts.slice().sort((a, c) => (c.updatedAt || 0) - (a.updatedAt || 0))[0].id; S.sel = null; replacedCur = true; }
    }
    S.drafts.filter(x => !x.example && !seen[x.id]).forEach(x => pushDraft(x.id));
    setCloud("saved"); renderDrafts(); renderPreview();
    if (replacedCur) renderEditor();
  }catch(e){ setCloud("slow"); }
}

$("#edit").addEventListener("click", e => {

});

async function copyRich(html, text){
  try{
    if (navigator.clipboard && window.ClipboardItem && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html], {type:"text/html"}), "text/plain":new Blob([text], {type:"text/plain"})})]);
      return "ok";
    }
  }catch(e){}
  try{
    const r = document.createRange(); r.selectNodeContents($("#article"));
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    let ok = false; try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    if (ok){ sel.removeAllRanges(); return "ok"; }
    return "selected";
  }catch(e){ return "fail"; }
}

function noticeFromData(j){

  const team = arr(j.team).filter(r => r && s(r.item));
  if (team.length){ B.push(b("section",{label:lab("组队"), title:"谁能参赛，怎么组队"})); B.push(b("table",{head:"核对项目 | 要求", rows:team.map(r => s(r.item) + " | " + s(r.req)).join("\n")})); }

  const ct = arr(j.contacts).filter(r => r && s(r.k));
  if (ct.length) B.push(b("table",{head:"联系渠道 | 信息", rows:ct.map(r => s(r.k) + " | " + s(r.v)).join("\n")}));
  const stp = arr(j.steps).filter(r => r && s(r.t));

  B.push(b("callout",{title:"", text:"**准备参赛的同学，可以把这篇转给队友：**一起确认分工和时间安排。"}));

    S.drafts = S.drafts.filter(x => !x.example); S.drafts.push(d); S.cur = d.id; S.sel = null;
    renderAll(); touch();
    msg.textContent = "已生成。请对照原文逐项核对日期、人数和链接。";
  }catch(e){
    const c = e && e.code;
    msg.textContent = c === "rate_limited" ? "请求太频繁，稍等一会儿再试。" : c === "not_granted" ? "没有获得调用许可，可以直接用“通知型”模板手动填写。" : "没能提取成功。可以再试一次，或直接用“通知型”模板手动填写。";
  }
  btn.disabled = false;
});

/* ---------- 封面与配图 ---------- */
const SIZES = {head:[1410,600,"头条封面"], sq:[600,600,"次条封面"], wide:[1280,720,"文内横图"]};
const CF = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
function hexRGB(h){ const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(h, k){ const c = hexRGB(h).map(v => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)))); return "rgb(" + c.join(",") + ")"; }
function rgba(h, a){ return "rgba(" + hexRGB(h).join(",") + "," + a + ")"; }
function wrap(c, text, maxW){
  const out = [];
  String(text || "").split("\n").forEach(par => {
    let line = "";
    Array.from(par).forEach(ch => {
      if (c.measureText(line + ch).width > maxW && line){
        if ("，。！？、：；）》”".indexOf(ch) >= 0){ line += ch; out.push(line); line = ""; return; }
        out.push(line); line = ch;
      } else line += ch;
    });
    if (line) out.push(line);
  });
  return out;
}
function fit(c, text, maxW, maxLines, start, min, weight){
  let size = start, ls = [];
  for (;;){ c.font = (weight || "bold") + " " + Math.round(size) + "px " + CF; ls = wrap(c, text, maxW); if (ls.length <= maxLines || size <= min) break; size *= 0.94; }
  return {size:Math.round(size), lines:ls.slice(0, maxLines)};
}
function pill(c, x, y, text, h, bg, fg){
  c.font = "bold " + Math.round(h * 0.52) + "px " + CF; const w = c.measureText(text).width + h * 0.9, r = h / 2;
  c.fillStyle = bg; c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2); c.lineTo(x + r, y + h); c.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5); c.fill();
  c.fillStyle = fg; c.textBaseline = "middle"; c.fillText(text, x + h * 0.45, y + r + h * 0.03); c.textBaseline = "alphabetic";
  return w;
}
function fillCover(){
  const d = cur(), hero = d.blocks.find(x => x.type === "hero");
  $("#cvTag").value = TPL[d.tpl].tag;
  $("#cvTitle").value = hero && hero.title ? hero.title : (d.title || "").slice(0, 24);
  $("#cvSub").value = hero && hero.foot ? hero.foot : "";
}
function drawCover(){
  const cv = $("#cv"), size = $("#cvSize").value, style = $("#cvStyle").value, t = theme();
  const W = SIZES[size][0], H = SIZES[size][1], sq = size === "sq";
  cv.width = W; cv.height = H;
  const c = cv.getContext("2d"), pad = Math.round(H * (sq ? 0.1 : 0.12));
  const tag = $("#cvTag").value.trim(), title = $("#cvTitle").value.trim() || "主标题", sub = $("#cvSub").value.trim(), name = S.settings.name || "";
  let ink = "#FFFFFF", subInk = t.glow, footInk = "rgba(255,255,255,.72)", pillBg = t.glow, pillFg = t.main, textW = W - pad * 2;
  if (style === "dark"){
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, t.main); g.addColorStop(1, shade(t.main, -0.4)); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.strokeStyle = "rgba(255,255,255,.07)"; c.lineWidth = H * 0.04;
    for (let i = 1; i <= 6; i++){ c.beginPath(); c.arc(W * 0.94, H * 1.08, H * (0.2 + i * 0.17), 0, Math.PI * 2); c.stroke(); }
    c.fillStyle = "rgba(255,255,255,.22)";
    for (let i = 0; i < 7; i++) for (let j = 0; j < 4; j++){ c.beginPath(); c.arc(W - pad - i * H * 0.05, pad + j * H * 0.05, H * 0.006, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = t.accent; c.fillRect(0, 0, Math.max(8, W * 0.008), H);
    if (!sq) textW = W * 0.72;
  } else if (style === "light"){
    c.fillStyle = t.soft; c.fillRect(0, 0, W, H);
    const cx = sq ? W * 0.98 : W * 0.93, cy = sq ? H * 1.0 : H * 0.5, r = sq ? H * 0.42 : H * 0.6;
    c.fillStyle = t.main; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = t.accent; c.lineWidth = H * 0.012; c.beginPath(); c.arc(cx, cy, r + H * 0.09, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = rgba(t.accent, .35); c.lineWidth = H * 0.006; c.beginPath(); c.arc(cx, cy, r + H * 0.2, 0, Math.PI * 2); c.stroke();
    c.fillStyle = t.accent; c.beginPath(); c.arc(sq ? W * 0.84 : W * 0.66, sq ? H * 0.16 : H * 0.17, H * 0.035, 0, Math.PI * 2); c.fill();
    ink = shade(t.main, -0.15); subInk = t.accent; footInk = "#7A8794"; pillBg = t.main; pillFg = "#FFFFFF";
    textW = sq ? W - pad * 2 : W * 0.58;
  } else {
    const cut = sq ? H * 0.66 : W * 0.66;
    c.fillStyle = t.soft; c.fillRect(0, 0, W, H);
    c.save(); c.beginPath(); if (sq) c.rect(0, cut, W, H - cut); else c.rect(cut, 0, W - cut, H); c.clip();
    c.strokeStyle = rgba(t.accent, .28); c.lineWidth = H * 0.012;
    for (let i = -H; i < W + H; i += H * 0.07){ c.beginPath(); c.moveTo(i, H); c.lineTo(i + H, 0); c.stroke(); }
    c.restore();
    c.fillStyle = t.main; if (sq) c.fillRect(0, 0, W, cut); else c.fillRect(0, 0, cut, H);
    c.fillStyle = t.accent; if (sq) c.fillRect(0, cut - H * 0.014, W, H * 0.014); else c.fillRect(cut - W * 0.006, 0, W * 0.006, H);
    if (!sq && sub){
      const bw = W - cut - pad * 1.2, bx = cut + pad * 0.6, f = fit(c, sub.replace(/^报名[:：]\s*/, ""), bw - pad * 0.6, 3, H * 0.085, H * 0.05), bh = f.lines.length * f.size * 1.4 + pad * 0.7, by = (H - bh) / 2;
      c.fillStyle = "#FFFFFF"; c.fillRect(bx, by, bw, bh); c.fillStyle = t.main; c.font = "bold " + f.size + "px " + CF;
      f.lines.forEach((l, i) => c.fillText(l, bx + pad * 0.3, by + pad * 0.35 + f.size * (1.05 + i * 1.4)));
    }
    textW = (sq ? W : cut) - pad * 2;
  }
  let y = pad;
  if (tag){ pill(c, pad, y, tag, H * (sq ? 0.1 : 0.115), pillBg, pillFg); }
  const splitSub = style === "split" && !sq;
  const f = fit(c, title, textW, sq ? 3 : 2, H * (sq ? 0.15 : 0.2), H * 0.08);
  const blockH = f.lines.length * f.size * 1.28 + (sub && !splitSub ? H * 0.1 : 0);
  const areaTop = pad + H * 0.14, areaBot = (style === "split" && sq ? H * 0.66 : H) - pad - H * 0.06;
  y = areaTop + Math.max(0, (areaBot - areaTop - blockH) / 2) + f.size;
  c.fillStyle = ink; c.font = "bold " + f.size + "px " + CF;
  f.lines.forEach((l, i) => c.fillText(l, pad, y + i * f.size * 1.28));
  if (sub && !splitSub){ const fs = fit(c, sub, textW, 1, H * 0.062, H * 0.04, "normal"); c.fillStyle = subInk; c.font = "normal " + fs.size + "px " + CF; c.fillText(fs.lines[0] || "", pad, y + (f.lines.length - 1) * f.size * 1.28 + H * 0.125); }
  if (name){
    const fy = H - pad * 0.7; c.fillStyle = (style === "split" && sq) ? "#7A8794" : footInk; c.font = "normal " + Math.round(H * 0.05) + "px " + CF;
    c.fillRect(pad, fy - H * 0.017, H * 0.06, Math.max(2, H * 0.004)); c.fillText(name, pad + H * 0.08, fy);
  }
}
["cvSize","cvStyle"].forEach(id => $("#" + id).addEventListener("change", drawCover));
["cvTag","cvSub","cvTitle"].forEach(id => $("#" + id).addEventListener("input", drawCover));
$("#cvFill").addEventListener("click", () => { fillCover(); drawCover(); });
$("#cvSave").addEventListener("click", () => {
  drawCover();
  const cv = $("#cv"), fname = SIZES[$("#cvSize").value][2] + "-" + ((cur().title || "封面").slice(0, 16)) + ".png";
  cv.toBlob(async blob => {
    if (blob && dl){
      try{ await dl.save({filename:fname, data:blob}); toast("图片已保存"); return; }
      catch(e){ if (e && e.code === "declined"){ toast("已取消保存"); return; } }
    }
    try{ $("#coverOut").innerHTML = '<p class="hint">在下面这张图上点右键，选“图片另存为”。</p><img alt="生成的封面图" src="' + cv.toDataURL("image/png") + '">'; toast("图片已生成在下方，右键另存"); }
    catch(e){ toast("没能生成图片"); }
  }, "image/png");
});

/* ---------- 启动 ---------- */
renderNew(); renderAll(); setCloud("wait"); initCaps();
</script>
