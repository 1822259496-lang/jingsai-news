<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>竞赛引流工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 布局：左侧深紫侧边栏（头像 + 分组菜单 + 版本状态），右侧白色内容卡（页头图标 + 标题 + 统计 + 标签 + 内容） */
:root{
  --side-1:#1a1430; --side-2:#2b1d55; --side-ink:#c9c2e6; --side-dim:#8d84b3;
  --accent:#7b5cff; --accent-2:#a97bff; --accent-soft:#efeaff;
  --bg:#f5f6fa; --card:#ffffff; --ink:#1f2235; --muted:#7a8098; --line:#e6e8f0;
  --ok:#18a058; --ok-soft:#e7f7ee; --warn:#d9480f; --warn-soft:#fff1e8;
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.6;color:var(--ink);background:var(--side-1)}
button,select,input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
/* 侧边栏 */
aside{background:linear-gradient(180deg,var(--side-2),var(--side-1) 70%);color:var(--side-ink);display:flex;flex-direction:column;gap:14px;padding:22px 12px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.me{display:flex;flex-direction:column;align-items:center;gap:6px}
.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ff8fb1,var(--accent-2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;border:3px solid rgba(255,255,255,.18);position:relative}
.avatar::after{content:"";position:absolute;right:2px;bottom:2px;width:11px;height:11px;border-radius:50%;background:#3ad17a;border:2px solid var(--side-2)}
.me b{color:#fff;font-size:14px}
.me small{color:var(--side-dim);font-size:12px}
.group{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 6px}
.group-h{display:flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:13px;padding:4px 8px 6px}
.menu a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--side-ink);text-decoration:none;font-size:13px}
.menu a:hover{background:rgba(255,255,255,.06)}
.menu a.on{background:linear-gradient(90deg,var(--accent),#6a4ae0);color:#fff;font-weight:700}
.menu svg,.group-h svg{width:15px;height:15px;flex:none}
.ver{margin-top:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:10px;padding:9px 10px;font-size:12px}
.ver .shield{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff}
.ver .shield svg{width:15px;height:15px}
.ver dl{margin:0;display:grid;grid-template-columns:auto auto;gap:0 14px;flex:1}
.ver dt{color:var(--side-dim)} .ver dd{margin:0;text-align:right;color:#fff;font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:#3ad17a}
.dot.off{background:#f0a35a}
/* 主区域 */
main{background:var(--bg);border-radius:14px 0 0 0;margin-top:10px;min-width:0;display:flex;flex-direction:column}
.page{display:none;flex-direction:column;min-height:100%}
.page.on{display:flex}
.ph{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);padding:16px 24px;border-bottom:1px solid var(--line);border-radius:14px 0 0 0}
.ph-l{display:flex;align-items:center;gap:12px}
.ph-ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#fff}
.ph-ic svg{width:19px;height:19px}
.ph h1{margin:0;font-size:17px;line-height:1.3}
.ph p{margin:0;font-size:12px;color:var(--muted)}
.stats{display:flex;gap:22px}
.stat{text-align:center}
.stat b{display:block;color:var(--accent);font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}
.body{padding:18px 24px 80px;flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btn{border:0;border-radius:999px;padding:7px 16px;cursor:pointer;background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#fff;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 11px;font-size:12px}
.btn.green{background:var(--ok)} .btn.red{background:#e5484d}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 14px;cursor:pointer;font-size:13px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.split{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{margin:0 0 12px;font-size:15px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
select,input[type=text],textarea{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:110px}
.seg{display:flex;gap:6px}
/* 空状态（参照截图） */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 16px;gap:10px;color:var(--muted)}
.empty .big{width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(123,92,255,.25)}
.empty .big svg{width:28px;height:28px}
.empty strong{color:var(--ink);font-size:15px}
.empty p{margin:0;max-width:420px;font-size:13px}
.feats{display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:8px 40px;margin-top:14px;font-size:12px;text-align:left}
.feats span{display:flex;align-items:center;gap:7px;color:var(--muted)}
.feats svg{width:14px;height:14px;color:var(--accent)}
/* 结果 */
.stream{white-space:pre-wrap;font-size:14px}
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.sec-b{padding:10px 12px;white-space:pre-wrap;font-size:14px}
mark{background:var(--warn-soft);color:var(--warn);border-bottom:2px solid var(--warn);padding:0 2px}
.check{border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.check.good{background:var(--ok-soft);color:var(--ok)}
.check.bad{background:var(--warn-soft);color:var(--warn)}
/* 列表行（参照截图里的智能体卡片） */
.rows{display:flex;flex-direction:column;gap:12px}
.rowc{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px}
.rowc.done{border-left-color:var(--ok)}
.rowc .ic{width:46px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;white-space:nowrap}
.ic.xhs{background:#ff2e4d} .ic.dy{background:#111}
.rowc h4{margin:0;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.pill{font-size:11px;padding:1px 8px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.wait{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:700px){.rowc{grid-template-columns:auto 1fr}.acts{grid-column:1/-1;justify-content:flex-start}}
/* 资料库与日历 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.comp{display:flex;flex-direction:column;gap:8px}
.comp h4{margin:0;font-size:15px;line-height:1.4}
.tl{display:flex;flex-direction:column;gap:2px;font-size:13px;border-left:2px solid var(--accent-soft);padding-left:10px}
.tl b{display:inline-block;min-width:58px;color:var(--accent);font-variant-numeric:tabular-nums}
.comp p{margin:0;font-size:13px;color:var(--muted)}
.comp .btn{align-self:flex-start;margin-top:auto}
.mon{display:flex;flex-direction:column;gap:7px}
.mon.now{border:2px solid var(--accent)}
.mon-h{display:flex;justify-content:space-between;align-items:center}
.mon-h strong{font-size:20px;font-variant-numeric:tabular-nums}
.mon ul{margin:0;padding-left:18px;font-size:12px;color:var(--muted)}
.mon .btn{align-self:flex-start;margin-top:auto}
/* 帮助与弹窗 */
.help{position:fixed;right:22px;bottom:22px;z-index:20;box-shadow:0 6px 18px rgba(123,92,255,.35)}
.modal{position:fixed;inset:0;background:rgba(20,16,40,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal.on{display:flex}
.modal .card{max-width:720px;width:100%;max-height:86vh;overflow:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal-h h2{margin:0}
.notice{font-size:12px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:7px 12px;margin-bottom:14px}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:column}
  .me{flex-direction:row;justify-content:center}
  main{border-radius:0;margin-top:0}
  .ph{border-radius:0}
  .stats{gap:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="me"><div class="avatar" aria-hidden="true">竞</div><div style="text-align:center"><b>竞赛引流工作台</b><br><small>小红书 · 抖音 → 微信</small><br><small><a href="../" style="color:#c9c2e6">查看资讯日报 →</a></small></div></div>
  <div class="group">
    <div class="group-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>公域引流</div>
    <nav class="menu" id="menu1"></nav>
  </div>
  <div class="group">
    <div class="group-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM17 6h3a3 3 0 01-3 4M7 6H4a3 3 0 003 4"/></svg>竞赛工具</div>
    <nav class="menu" id="menu2"></nav>
  </div>
  <div class="ver"><div class="shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></svg></div>
    <dl><dt>助理版本</dt><dd>v1.1</dd><dt>AI 状态</dt><dd id="aiState"><span class="dot off"></span>连接中</dd></dl></div>
</aside>

<main id="main"></main>
</div>

<button class="btn help" id="helpBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h7a3 3 0 013 3v12a2 2 0 00-2-2H4zM20 5h-5"/></svg>查看帮助</button>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="card"><div class="modal-h"><h2 id="mTitle"></h2><button class="btn line sm" id="mClose">关闭</button></div><div id="mBody"></div></div></div>

<script>
// ================= 图标 =================
const I = {
 pen:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
 fire:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-3 2-4 2-7 2 1 3 3 3 5"/>',
 box:'<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
 book:'<path d="M4 5h7a3 3 0 013 3v12a2 2 0 00-2-2H4zM20 5h-6"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-6-6-9 9"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 send:'<path d="M3 11l18-8-8 18-2-8-8-2z"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
};
const svg = (k,c="")=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

// ================= 页面定义 =================
const PAGES = [
 {id:"create",g:1,ic:"pen",name:"AI 写笔记/脚本",sub:"一键生成小红书图文与抖音口播，自带引流话术"},
 {id:"analyze",g:1,ic:"fire",name:"对标爆款拆解",sub:"拆解同行爆款标题套路，仿写成你的"},
 {id:"drafts",g:1,ic:"box",name:"待发内容",sub:"管理生成的内容，跟踪发布状态"},
 {id:"calendar",g:1,ic:"cal",name:"内容发布计划",sub:"按竞赛节点排好全年选题"},
 {id:"risk",g:1,ic:"shield",name:"风控检测",sub:"发布前检查导流违规词和绝对化用语"},
 {id:"library",g:2,ic:"book",name:"竞赛资料库",sub:"主流大学生竞赛的往年节点与含金量"},
 {id:"reply",g:2,ic:"chat",name:"私信话术助手",sub:"学生私信来了，帮你想好怎么回"}
];
document.getElementById("menu1").innerHTML = PAGES.filter(p=>p.g===1).map(p=>`<a href="#${p.id}" data-v="${p.id}">${svg(p.ic)}${p.name}</a>`).join("");
document.getElementById("menu2").innerHTML = PAGES.filter(p=>p.g===2).map(p=>`<a href="#${p.id}" data-v="${p.id}">${svg(p.ic)}${p.name}</a>`).join("");

// ================= 竞赛数据（往年规律，月份为大致区间） =================
const COMPS = [
 {id:"cxds",name:"中国国际大学生创新大赛（原“互联网+”）",cat:"创新创业",list:true,team:"3–15 人",majors:"全专业",nodes:[[3,5,"校赛"],[6,8,"省赛"],[10,11,"全国总决赛"]],sell:"高教学会榜单第 1 位，保研、评优认可度最高。",note:"2025 年起由“互联网+”大赛更名"},
 {id:"xtz",name:"“挑战杯”中国大学生创业计划竞赛（小挑）",cat:"创新创业",list:true,team:"一般不超过 10 人",majors:"全专业",nodes:[[2,4,"校赛"],[5,6,"省赛"],[10,11,"全国终审决赛"]],sell:"与大挑隔年举办，通常在偶数年，考察商业计划书和路演。",note:"以当届通知为准"},
 {id:"dtz",name:"“挑战杯”全国大学生课外学术科技作品竞赛（大挑）",cat:"创新创业",list:true,team:"个人或团队",majors:"全专业（含哲社调研）",nodes:[[2,4,"校赛"],[5,6,"省赛"],[10,11,"全国终审决赛"]],sell:"通常在奇数年举办，学术含量高，社会调查报告类适合文科生。",note:"以当届通知为准"},
 {id:"fwwb",name:"中国大学生服务外包创新创业大赛",cat:"创新创业",list:true,team:"3–5 人",majors:"计算机、经管、设计",nodes:[[11,3,"报名选题"],[4,4,"作品提交"],[5,6,"区域赛"],[7,8,"总决赛"]],sell:"企业命题，能做出完整产品，适合写进简历。"},
 {id:"sc",name:"全国大学生电子商务“创新、创意及创业”挑战赛（三创赛）",cat:"创新创业",list:true,team:"3–5 人",majors:"电商、经管、计算机",nodes:[[3,4,"校赛"],[5,5,"省赛"],[7,7,"全国总决赛"]],sell:"门槛相对低，是商科学生拿省级奖项的常见选择。"},
 {id:"jnjp",name:"全国大学生节能减排社会实践与科技竞赛",cat:"创新创业",list:true,team:"不超过 7 人",majors:"工科、环境、能源",nodes:[[3,5,"校内选拔"],[5,6,"作品提交"],[8,8,"全国决赛"]],sell:"作品类和社会实践调查类都可以参赛，工科生容易出成果。"},
 {id:"gs",name:"全国大学生数学建模竞赛（国赛）",cat:"学科技能",list:true,team:"3 人",majors:"全专业（理工经管为主）",nodes:[[5,8,"培训与校赛"],[9,9,"比赛（三天三夜）"],[11,12,"公布获奖"]],sell:"参赛人数最多的竞赛之一，省奖获奖率较高，保研认可度高。"},
 {id:"ms",name:"美国大学生数学建模竞赛（美赛 MCM/ICM）",cat:"学科技能",list:false,team:"3 人",majors:"全专业",nodes:[[12,1,"报名"],[1,2,"比赛（四天）"],[5,5,"公布结果"]],sell:"不在高教学会榜单内，但很多高校认可；英文论文，获奖面大。",note:"保研是否认可，看本校文件"},
 {id:"ds",name:"全国大学生电子设计竞赛（电赛）",cat:"学科技能",list:true,team:"3 人",majors:"电子、自动化、通信",nodes:[[3,6,"校内培训"],[7,8,"全国赛（奇数年）/省赛（偶数年）"]],sell:"电子类含金量最高的比赛之一，四天三夜实物制作。"},
 {id:"lqb",name:"蓝桥杯全国软件和信息技术专业人才大赛",cat:"学科技能",list:true,team:"个人",majors:"计算机、电子",nodes:[[10,12,"报名"],[4,4,"省赛"],[6,6,"国赛"]],sell:"个人赛，零基础也能备赛，省奖获奖率较高。"},
 {id:"icpc",name:"ACM-ICPC 国际大学生程序设计竞赛",cat:"学科技能",list:true,team:"3 人",majors:"计算机",nodes:[[3,6,"校赛/邀请赛"],[9,12,"区域赛"]],sell:"算法竞赛的最高水平，区域赛奖牌对求职和保研都很有分量。"},
 {id:"jsj",name:"中国大学生计算机设计大赛",cat:"学科技能",list:true,team:"1–5 人",majors:"全专业（含文科、设计）",nodes:[[3,4,"校赛"],[5,6,"省赛"],[7,8,"国赛"]],sell:"大类很多（软件、微课、数媒、AI 应用），文科生也能参加。"},

function highlight(text){let h=esc(text);const hits=new Set();SENSITIVE.slice().sort((a,b)=>b.length-a.length).forEach(w=>{const re=new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g");if(re.test(h)){hits.add(w);h=h.replace(re,`<mark>${esc(w)}</mark>`);}});return{html:h,hits:[...hits]};}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);btn.textContent="已复制";setTimeout(()=>btn.textContent="复制",1200);}catch(e){btn.textContent="请手动复制";}}
function parseSections(text){const parts=[];const re=/【([^】]{1,20})】/g;let m,last=null;while((m=re.exec(text))){if(last)parts.push({title:last.t,body:text.slice(last.end,m.index).trim()});last={t:m[1],end:re.lastIndex};}if(last)parts.push({title:last.t,body:text.slice(last.end).trim()});return parts.filter(p=>p.body);}
function checkBox(hits){return hits.length?`<div class="check bad">发现 ${hits.length} 个可能触发限流或违规的词：${hits.map(esc).join("、")}。已在下方标出，发布前请改掉。</div>`:`<div class="check good">风控检测通过：没有发现导流违规词和绝对化用语。</div>`;}
function renderSections(el,text,withCheck=true){
  const secs=parseSections(text);
  if(!secs.length){const r=withCheck?highlight(text):{html:esc(text),hits:[]};el.innerHTML=(withCheck?checkBox(r.hits):"")+`<div class="stream">${r.html}</div>`;return secs;}
  const all=new Set();let html="";
  secs.forEach((s,i)=>{const r=withCheck?highlight(s.body):{html:esc(s.body),hits:[]};r.hits.forEach(h=>all.add(h));html+=`<div class="sec"><div class="sec-h"><span>${esc(s.title)}</span><button class="btn line sm" data-copy="${i}">复制</button></div><div class="sec-b">${r.html}</div></div>`;});
  el.innerHTML=(withCheck?checkBox([...all]):"")+html;
  el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(secs[+b.dataset.copy].body,b));
  return secs;
}

async function syncDaily(){

    const r=await fetch("../data/drafts.json?v="+Date.now()); if(!r.ok) return;
    const d=await r.json(); let l=load(); let del=[]; try{del=JSON.parse(localStorage.getItem("jsw_deleted")||"[]");}catch(e){}
    const ids=new Set(l.map(x=>String(x.id))); let n=0;
    (d.items||[]).forEach(x=>{ if(!ids.has(String(x.id))&&!del.includes(String(x.id))){ l.push({...x,daily:true,done:false}); n++; } });
    if(n){ l.sort((a,b)=>b.time-a.time); store(l.slice(0,150)); refreshStats(); if(location.hash==="#drafts") route(); }
  }catch(e){}
}

function statsFor(id){
  const l=load(),now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const w0=d0-((now.getDay()+6)%7)*864e5,m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const f=t=>{const s=l.filter(x=>x.time>=t);return`${s.filter(x=>x.done).length}/${s.length}`;};

// 复制模式：网页里调不了 AI 时，给出完整提示词，粘贴到任意 AI 生成后再贴回来检查
function promptMode(prompt,outEl,withCheck,onDone){
  outEl.innerHTML=`<div class="check good">第 1 步：复制下面的提示词，粘贴到 DeepSeek、豆包、Kimi 或 Claude 里发送。</div>
  <div class="sec"><div class="sec-h"><span>提示词</span><button class="btn sm" id="pmCopy">复制提示词</button></div><div class="sec-b" style="max-height:220px;overflow:auto;color:var(--muted)">${esc(prompt)}</div></div>
  <div class="check good">第 2 步：把 AI 回复的全部内容粘贴到这里，点“检查并整理”。</div>
  <textarea id="pmBack" style="min-height:160px" placeholder="把 AI 生成的结果粘贴到这里"></textarea>
  <div class="toolbar" style="margin-top:10px"><button class="btn" id="pmGo">${svg("shield")}检查并整理</button></div><div id="pmOut"></div>`;
  outEl.querySelector("#pmCopy").onclick=e=>copyText(prompt,e.currentTarget);
  outEl.querySelector("#pmGo").onclick=()=>{
    const t=outEl.querySelector("#pmBack").value.trim(); if(!t) return;
    const secs=renderSections(outEl.querySelector("#pmOut"),t,withCheck);
    if(onDone){onDone(t,secs);outEl.querySelector("#pmOut").insertAdjacentHTML("afterbegin",`<div class="check good">已存入“待发内容”。</div>`);}
  };
}
async function runAI(prompt,outEl,{withCheck=true,onDone,stopBtn}={}){
  if(!sample){promptMode(prompt,outEl,withCheck,onDone);return;}
  const ctrl=new AbortController();
  if(stopBtn){stopBtn.hidden=false;stopBtn.onclick=()=>ctrl.abort();}
  document.querySelectorAll("[data-ai]").forEach(b=>b.disabled=true);
  outEl.innerHTML=`<div class="stream">正在思考……</div>`;const s=outEl.querySelector(".stream");
  try{
    const r=await sample(prompt,{signal:ctrl.signal,onText:({text})=>{s.textContent=text;}});
    const secs=renderSections(outEl,r.text,withCheck);onDone&&onDone(r.text,secs);
  }catch(e){
    if(e&&e.text)renderSections(outEl,e.text,withCheck);
    const msg=e?.code==="rate_limited"?"请求太频繁，请稍等一分钟再试。":e?.code==="not_granted"?"没有获得调用 Claude 的授权，AI 功能不可用。":(ctrl.signal.aborted?"已停止生成。":"生成失败："+(e?.message||"请重试"));
    outEl.insertAdjacentHTML("afterbegin",`<div class="check bad">${esc(msg)}</div>`);
  }finally{
    document.querySelectorAll("[data-ai]").forEach(b=>b.disabled=false);
    if(stopBtn)stopBtn.hidden=true;
  }
}
